name: Terraform

on:
  push:
    branches: [dev]
    paths:
      - "**/*.tf"
      - ".github/workflows/terraform.yml"

  pull_request:
    paths:
      - "**/*.tf"
      - ".github/workflows/terraform.yml"

  workflow_dispatch:

jobs:
  fmt:
    name: FMT
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff

  discover:
    name: Discover Terraform directories
    needs: fmt
    runs-on: ubuntu-latest

    outputs:
      directories: ${{ steps.discover.outputs.directories }}

    steps:
      - uses: actions/checkout@v4

      - name: Discover Terraform root modules
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t directories < <(
            find . \
              -type f \
              -name '*.tf' \
              -not -path './.git/*' \
              -not -path '*/.terraform/*' \
              -printf '%h\n' |
            sort -u |
            sed 's#^\./##' |
            grep -v '^vpc/modules/'
          )

          echo "Discovered Terraform directories:"
          printf '%s\n' "${directories[@]}"

          if [ "${#directories[@]}" -eq 0 ]; then
            echo "ERROR: No Terraform directories found."
            exit 1
          fi

          directories_json=$(
            printf '%s\n' "${directories[@]}" |
            jq -R -s -c 'split("\n") | map(select(length > 0))'
          )

          echo "Terraform matrix:"
          echo "$directories_json" | jq .

          echo "directories=$directories_json" >> "$GITHUB_OUTPUT"

  validate:
    name: validate (${{ matrix.directory }})
    needs:
      - discover

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.discover.outputs.directories) }}

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ matrix.directory }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: terraform validate
        run: terraform validate

  plan:
    name: plan (${{ matrix.directory }})
    needs: validate

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.discover.outputs.directories) }}

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false

      - name: terraform plan
        run: terraform plan -input=false
