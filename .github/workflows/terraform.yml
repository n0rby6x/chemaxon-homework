name: Terraform Plan

on:
  push:
    branches: [dev]
    paths:
      - "backup-bucket/**"
      - "vpc/**"
      - "k8s/**"
      - ".github/workflows/terraform.yml"

  workflow_dispatch: {}

jobs:
  fmt:
    name: FMT
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -diff

  validate:
    name: validate (${{ matrix.module }})
    needs: fmt
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module:
          - vpc/modules/vpc
          - vpc/examples/basic
          - backup-bucket

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

  plan:
    name: terraform plan (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: validate

    strategy:
      fail-fast: false
      matrix:
        include:
          - module: vpc/examples/basic
            state_key: vpc/terraform.tfstate

          - module: backup-bucket
            state_key: backup-bucket/terraform.tfstate

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ matrix.state_key }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: terraform plan
        run: terraform plan -input=false

  k8s:
    name: Kubernetes validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: k8s

    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Kubernetes manifests
        run: |
          kubectl kustomize k8s > /tmp/k8s-rendered.yaml

      - name: Show rendered manifests
        run: cat /tmp/k8s-rendered.yaml
